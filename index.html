<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>積みプラ相談所</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1><a href="./">積みプラ相談所</a></h1>
    <p>積んだままのキットに、作った人の声を集める。</p>
  </div>
</header>

<main class="wrap">
  <form class="panel" id="searchForm" role="search">
    <h2>キットを探す</h2>
    <p class="lead">キット名の一部で探せます。空白で区切ると、すべての語を含むキットに絞り込みます。</p>
    <label for="q">キット名</label>
    <div class="search-row">
      <input type="search" id="q" name="q" autocomplete="off" placeholder="例:エアリアル、ドアン専用ザク">
      <button class="btn" type="submit">検索</button>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
  </form>

  <p class="status" id="status" aria-live="polite"></p>
  <div class="kit-grid" id="results"></div>
</main>

<script type="module">
import { searchKits, errorMessage } from './assets/api.js';

const form = document.getElementById('searchForm');
const input = document.getElementById('q');
const status = document.getElementById('status');
const results = document.getElementById('results');
const errorBox = document.getElementById('error');

let latest = 0; // 古い検索結果で上書きしないための番号

function kitCard({ kit, alias }) {
  const a = document.createElement('a');
  a.className = 'kit-card';
  a.href = `kit.html?id=${encodeURIComponent(kit.id)}`;

  const spine = document.createElement('span');
  spine.className = 'spine';
  spine.textContent = kit.scale || 'KIT';

  const body = document.createElement('span');
  body.className = 'body';
  const h3 = document.createElement('h3');
  h3.textContent = kit.name;
  const maker = document.createElement('p');
  maker.className = 'maker';
  maker.textContent = [kit.maker || 'メーカー不明', kit.scale].filter(Boolean).join(' / ');
  body.append(h3, maker);
  if (alias) {
    const hit = document.createElement('p');
    hit.className = 'hit';
    hit.textContent = `別名「${alias}」で一致`;
    body.append(hit);
  }
  a.append(spine, body);
  return a;
}

async function run(query) {
  const id = ++latest;
  errorBox.hidden = true;
  if (!query.trim()) {
    status.textContent = '';
    results.replaceChildren();
    return;
  }
  status.textContent = '検索しています…';
  try {
    const { kits, truncated } = await searchKits(query);
    if (id !== latest) return;
    results.replaceChildren(...kits.map(kitCard));
    status.textContent = kits.length
      ? `${kits.length}件見つかりました${truncated ? '(多いので先頭の50件まで。語を足して絞り込んでください)' : ''}`
      : '';
    if (!kits.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = `「${query.trim()}」に一致するキットは見つかりませんでした。短い語や別の書き方で試してください。`;
      results.replaceChildren(empty);
    }
  } catch (err) {
    if (id !== latest) return;
    status.textContent = '';
    results.replaceChildren();
    errorBox.textContent = errorMessage(err);
    errorBox.hidden = false;
  }
}

// 検索語を URL(?q=)に残す。詳細画面から「戻る」で結果に戻れる
function searchFromUrl() {
  const q = new URLSearchParams(location.search).get('q') ?? '';
  input.value = q;
  run(q);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  const url = q ? `?q=${encodeURIComponent(q)}` : location.pathname;
  history.pushState(null, '', url);
  run(q);
});

// 入力の途中でも、少し止まったら検索する
let timer;
input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const q = input.value.trim();
    history.replaceState(null, '', q ? `?q=${encodeURIComponent(q)}` : location.pathname);
    run(q);
  }, 350);
});

window.addEventListener('popstate', searchFromUrl);
searchFromUrl();
input.focus();
</script>
</body>
</html>
