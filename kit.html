<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キット詳細 | 積みプラ相談所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 太さは 400・500・700 だけ読み込む。フォントの読み込みを待たずに画面を出す
     (読み込めない・遅いときは標準ゴシック体のまま表示される) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/style.css?v=3">
<script src="assets/boot.js?v=3" defer></script>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1><a href="./">積みプラ相談所</a></h1>
    <p>積んだままのキットに、作った人の声を集める。</p>
  </div>
</header>

<main class="wrap">
  <div class="topbar">
    <a class="btn-ghost" id="backLink" href="./">← 検索に戻る</a>
  </div>

  <p class="status" id="status" aria-live="polite">読み込んでいます…</p>
  <div class="error" id="error" role="alert" hidden></div>

  <section id="kit" hidden>
    <div class="kit-head">
      <h2 id="name"></h2>
    </div>
    <dl class="spec">
      <dt>メーカー</dt><dd id="maker"></dd>
      <dt>スケール</dt><dd id="scale"></dd>
    </dl>
  </section>
</main>

<script type="module">
import { getKit, AppError } from './assets/api.js?v=3';
import { showError, hideError, markReady } from './assets/ui.js?v=3';

const status = document.getElementById('status');
const errorBox = document.getElementById('error');
const kitSection = document.getElementById('kit');

// 検索画面から来たときは、ブラウザの「戻る」と同じ動きにして検索結果に戻す
const backLink = document.getElementById('backLink');
if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
  backLink.addEventListener('click', (e) => { e.preventDefault(); history.back(); });
}

function setValue(el, value, fallback) {
  el.textContent = value || fallback;
  el.classList.toggle('unknown', !value);
}

async function load() {
  hideError(errorBox);
  status.hidden = false;
  status.textContent = '読み込んでいます…';
  try {
    const id = new URLSearchParams(location.search).get('id');
    let kit = await getKit(id);
    // 統合済みのキットなら統合先を表示する(最大5回までたどる)
    for (let i = 0; kit && kit.merged_into && i < 5; i++) {
      kit = await getKit(kit.merged_into);
    }
    if (kit && kit.id !== id) history.replaceState(null, '', `?id=${encodeURIComponent(kit.id)}`);

    status.hidden = true;
    if (!kit) {
      showError(errorBox, new AppError('このキットは見つかりませんでした。',
        'URLが正しいか確認するか、「← 検索に戻る」からお探しください。'));
      return;
    }
    document.title = `${kit.name} | 積みプラ相談所`;
    document.getElementById('name').textContent = kit.name;
    setValue(document.getElementById('maker'), kit.maker, '不明');
    setValue(document.getElementById('scale'), kit.scale, '表記なし');
    kitSection.hidden = false;
  } catch (err) {
    status.hidden = true;
    showError(errorBox, err, load);
  }
}

markReady();
load();
</script>
</body>
</html>
